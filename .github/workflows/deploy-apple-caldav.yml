name: Deploy Apple CalDAV Edge Function

on:
  push:
    branches:
      - calendar-import-options
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/apple-caldav-import/**'
      - '.github/workflows/deploy-apple-caldav.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Apple CalDAV function
        run: supabase functions deploy apple-caldav-import --project-ref qxoynttvipducubmczwl
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
