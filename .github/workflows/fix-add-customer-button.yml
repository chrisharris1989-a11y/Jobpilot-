name: Fix Add Customer button handler

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch customer button handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()
          old = '''  document
    .getElementById("addCustomerButton")
    .addEventListener(
      "click",
      showAddCustomerForm
    );'''
          new = '''  const addCustomerButton =
    document.getElementById("addCustomerButton");

  if (addCustomerButton) {
    addCustomerButton.onclick = event => {
      event.preventDefault();
      showAddCustomerForm();
    };
  }'''
          if old not in text:
              raise SystemExit('Expected Add Customer handler was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-add-customer-button.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/fix-add-customer-button.yml
          git commit -m "Fix Add Customer button handler"
          git push