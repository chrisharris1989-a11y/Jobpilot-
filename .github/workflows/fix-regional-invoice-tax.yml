name: Fix regional invoice tax default

on:
  push:
    paths:
      - '.github/workflows/fix-regional-invoice-tax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update new invoice tax default
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function showAddInvoiceForm()'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('showAddInvoiceForm not found')

          end = s.find('\nfunction ', start + len(marker))
          if end < 0:
              end = len(s)
          block = s[start:end]

          pattern = r'(id="invoiceVatPercent"[\s\S]{0,180}?step="0\.01"\s*\n\s*)value="20"'
          replacement = r'''\1value="${Number.isFinite(Number(settings.taxRate)) ? Number(settings.taxRate) : Number.isFinite(Number(settings.vatRate)) ? Number(settings.vatRate) : 20}"'''
          updated, count = re.subn(pattern, replacement, block, count=1)
          if count != 1:
              raise SystemExit('invoiceVatPercent hard-coded 20% input not found')

          s = s[:start] + updated + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit application change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Use regional tax rate for new invoices"
          git push
