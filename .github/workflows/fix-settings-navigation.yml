name: Fix Settings navigation
on:
  push:
    paths:
      - '.github/workflows/fix-settings-navigation.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Settings page routing
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          old = '''    tools: [
      "Tools",
      "Practical tools to help you plan and run your work."
    ],
  };'''
          new = '''    tools: [
      "Tools",
      "Practical tools to help you plan and run your work."
    ],

    settings: [
      "Settings",
      "Manage your JobPilot account settings."
    ],
  };'''
          if old not in text:
              raise SystemExit('Settings title insertion point not found')
          text = text.replace(old, new, 1)

          old = '''  if (page === "tools") {
    window.JobPilotTools?.open?.();
  }
}'''
          new = '''  if (page === "tools") {
    window.JobPilotTools?.open?.();
  }

  if (page === "settings") {
    window.renderSettings?.(content);
  }
}'''
          if old not in text:
              raise SystemExit('Settings routing insertion point not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Settings navigation" || true
          git rm .github/workflows/fix-settings-navigation.yml
          git commit -m "Remove Settings fix workflow" || true
          git push
