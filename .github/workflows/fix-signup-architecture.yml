name: Refactor signup architecture

on:
  push:
    paths:
      - '.github/workflows/fix-signup-architecture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refactor signup ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text()

          if 'import { startSignup } from "./signup-flow.js";' not in text:
              text = text.replace(
                  'import { supabase } from "./supabase.js";\n',
                  'import { supabase } from "./supabase.js";\nimport { startSignup } from "./signup-flow.js";\n',
                  1,
              )

          text = text.replace(
              '.getElementById("signupButton")\n    .addEventListener("click", signup);',
              '.getElementById("signupButton")\n    .addEventListener("click", startSignup);',
              1,
          )

          pattern = r'\nasync function signup\(\) \{.*?\n\}\n\n\nfunction showAuthMessage'
          replacement = '\nfunction showAuthMessage'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not remove legacy signup() from app.js')

          app.write_text(text)

          signup = Path('signup-flow.js')
          text = signup.read_text()
          text = re.sub(
              r'\n/\* Export the rebuilt entry point.*?css\(\);\n?$',
              '\nexport { startSignup };\n\ncss();\n',
              text,
              count=1,
              flags=re.S,
          )
          signup.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('  <script type="module" src="/signup-flow.js?v=20260914-rebuild"></script>\n', '')
          index.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-signup-architecture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js signup-flow.js index.html .github/workflows/fix-signup-architecture.yml
          git commit -m "Make app auth own the signup flow"
          git push
