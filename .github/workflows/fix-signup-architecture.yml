name: Refactor signup architecture

on:
  push:
    paths:
      - '.github/workflows/fix-signup-architecture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refactor signup ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()

          if 'import { startSignup } from "./signup-flow.js";' not in text:
              marker = 'import { supabase } from "./supabase.js";'
              if marker not in text:
                  raise SystemExit('Could not find supabase import in app.js')
              text = text.replace(marker, marker + '\nimport { startSignup } from "./signup-flow.js";', 1)

          old_handler = '.getElementById("signupButton")\n    .addEventListener("click", signup);'
          new_handler = '.getElementById("signupButton")\n    .addEventListener("click", startSignup);'
          if old_handler in text:
              text = text.replace(old_handler, new_handler, 1)
          elif new_handler not in text:
              raise SystemExit('Could not find signup button handler in app.js')

          start = text.find('async function signup()')
          if start != -1:
              end = text.find('function showAuthMessage', start)
              if end == -1:
                  raise SystemExit('Could not find showAuthMessage after legacy signup()')
              text = text[:start] + text[end:]

          app.write_text(text)

          signup = Path('signup-flow.js')
          text = signup.read_text()
          capture_start = text.find('/* Export the rebuilt entry point')
          if capture_start != -1:
              css_pos = text.rfind('css();')
              if css_pos == -1:
                  raise SystemExit('Could not find signup CSS initialisation')
              text = text[:capture_start] + 'export { startSignup };\n\ncss();\n'
          signup.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('  <script type="module" src="/signup-flow.js?v=20260914-rebuild"></script>\n', '')
          index.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-signup-architecture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js signup-flow.js index.html .github/workflows/fix-signup-architecture.yml
          git commit -m "Make app auth own the signup flow"
          git push
