name: Fix website JobPilot app URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace old JobPilot app URL
        run: |
          OLD='https://jobpilot-eosin-vercel.app'
          NEW='https://jobpilot-eosin.vercel.app'
          grep -rl --exclude-dir=.git "$OLD" website | xargs -r sed -i "s#${OLD}#${NEW}#g"

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-website-app-url.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website .github/workflows/fix-website-app-url.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix JobPilot website app URL'
          git push