name: Fix website index interactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-website-index.yml'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix website index
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('website/index.html')
          html = path.read_text(encoding='utf-8')

          # Make navigation and CTA links functional without changing the page design.
          replacements = [
              (r'<a>(Features)</a>', r'<a href="/features/">\1</a>'),
              (r'<a>(Pricing)</a>', r'<a href="/pricing/">\1</a>'),
              (r'<a>(Guides)</a>', r'<a href="/guides/">\1</a>'),
              (r'<a>(Customer Portal)</a>', r'<a href="/customer-portal/">\1</a>'),
              (r'<a>(Free business software)</a>', r'<a href="/free-business-software/">\1</a>'),
              (r'<a([^>]*)>(Start free)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Sign in)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Choose Solo)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Choose Team)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Choose Business)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Choose Pro)</a>', r'<a\1 href="https://jobpilot-eosin-vercel.app/">\2</a>'),
              (r'<a([^>]*)>(Explore features)</a>', r'<a\1 href="/features/">\2</a>'),
              (r'<a([^>]*)>(View pricing)</a>', r'<a\1 href="/pricing/">\2</a>'),
          ]
          for pattern, replacement in replacements:
              html = re.sub(pattern, replacement, html, flags=re.I)

          # Add a polished full-size image viewer for the dashboard and product screenshots.
          css = r'''
          /* Full-size image viewer */
          .image-preview{cursor:zoom-in;transition:transform .18s ease,box-shadow .18s ease}
          .image-preview:hover{transform:translateY(-2px);box-shadow:0 24px 55px rgba(16,24,40,.18)}
          .image-preview:focus-visible{outline:3px solid #2563eb;outline-offset:4px}
          .image-lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(15,23,42,.88)}
          .image-lightbox.is-open{display:flex}
          .image-lightbox img{display:block;max-width:min(1200px,94vw);max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 25px 80px rgba(0,0,0,.4)}
          .image-lightbox-close{position:absolute;top:18px;right:22px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#172033;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.2)}
          .image-lightbox-close:focus-visible{outline:3px solid #fff;outline-offset:3px}
          .image-lightbox-caption{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:90vw;color:#fff;text-align:center;font-size:13px}
          body.lightbox-open{overflow:hidden}
          '''
          if '/* Full-size image viewer */' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          script = r'''
          <div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Full-size image viewer">
            <button class="image-lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
            <img id="imageLightboxImg" src="" alt="">
            <div class="image-lightbox-caption" id="imageLightboxCaption"></div>
          </div>
          <script>
          (function(){
            const lightbox=document.getElementById('imageLightbox');
            if(!lightbox) return;
            const lightboxImg=document.getElementById('imageLightboxImg');
            const caption=document.getElementById('imageLightboxCaption');
            const closeBtn=lightbox.querySelector('.image-lightbox-close');
            let lastTrigger=null;
            const images=document.querySelectorAll('.dashboard img,.portal-box img,.gallery-item img');
            images.forEach(function(img){
              img.classList.add('image-preview');
              img.setAttribute('tabindex','0');
              img.setAttribute('role','button');
              img.setAttribute('aria-label',(img.alt||'Image')+' — open full size');
              function open(){
                lastTrigger=img;
                lightboxImg.src=img.currentSrc||img.src;
                lightboxImg.alt=img.alt||'';
                caption.textContent=img.alt||'';
                lightbox.classList.add('is-open');
                document.body.classList.add('lightbox-open');
                closeBtn.focus();
              }
              img.addEventListener('click',open);
              img.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
            });
            function close(){
              lightbox.classList.remove('is-open');
              document.body.classList.remove('lightbox-open');
              lightboxImg.removeAttribute('src');
              if(lastTrigger) lastTrigger.focus();
            }
            closeBtn.addEventListener('click',close);
            lightbox.addEventListener('click',function(e){if(e.target===lightbox) close();});
            document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lightbox.classList.contains('is-open')) close();});
          })();
          </script>
          '''
          if 'id="imageLightbox"' not in html:
              html = html.replace('</body>', script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          print(f'Updated {path} ({len(html)} bytes)')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
            exit 0
          fi
          git commit -m "Fix website buttons and add full-size image viewer"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-website-index.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary website fix workflow" || true
          git push || true
