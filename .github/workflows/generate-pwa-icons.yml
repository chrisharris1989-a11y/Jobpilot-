name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the exact approved PNG icons
        run: |
          # IMPORTANT: do not rasterise, composite, resize, or otherwise process the logo.
          # These are the exact PNG files from the version where the approved J was correct.
          git show 553871338d617a1f60b7db14aaa30208d0316f29:apple-touch-icon.png > apple-touch-icon.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-192.png > icon-192.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-512.png > icon-512.png

      - name: Commit exact approved icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Icons are already the exact approved PNGs."
          else
            git commit -m "Restore exact approved JobPilot icon artwork"
            git fetch origin main
            git rebase origin/main
            git push
          fi
