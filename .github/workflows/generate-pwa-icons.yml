name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the exact approved PNG icons under fresh filenames
        run: |
          # IMPORTANT: these files are copied byte-for-byte from the known-good commit.
          # No rasterising, compositing, resizing, or other processing is performed.
          git show 553871338d617a1f60b7db14aaa30208d0316f29:apple-touch-icon.png > jobpilot-apple-touch-icon-v2.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-192.png > jobpilot-icon-192-v2.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-512.png > jobpilot-icon-512-v2.png

      - name: Commit exact approved icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobpilot-apple-touch-icon-v2.png jobpilot-icon-192-v2.png jobpilot-icon-512-v2.png
          if git diff --cached --quiet; then
            echo "Cache-busted icons are already present."
          else
            git commit -m "Add cache-busted approved JobPilot PWA icons"
            git fetch origin main
            git rebase origin/main
            git push
          fi
