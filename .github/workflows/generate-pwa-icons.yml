name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the exact known-good PNG artwork
        run: |
          # IMPORTANT: exact PNG bytes from the version where the J was correct.
          # No rasterising, resizing, compositing, redrawing, or other alteration.
          git show 553871338d617a1f60b7db14aaa30208d0316f29:apple-touch-icon.png > apple-touch-icon.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-192.png > icon-192.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-512.png > icon-512.png

      - name: Commit exact known-good icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Exact known-good icons already exist."
          else
            git commit -m "Restore exact known-good JobPilot icons"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      # Force a fresh workflow run after icon-source changes without changing artwork.
      # This line is intentionally only a workflow comment; it has no effect on the PNGs.
