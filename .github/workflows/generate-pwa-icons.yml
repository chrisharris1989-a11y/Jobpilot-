name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate edge-clean PNG icons from the exact JobPilot SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          cat > icon-wrapper.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#06144f"/>
                <stop offset="0.55" stop-color="#0644d8"/>
                <stop offset="1" stop-color="#11c7f2"/>
              </linearGradient>
            </defs>
            <!-- Opaque background prevents a white halo around the existing logo when iOS applies its Home Screen mask. -->
            <rect width="512" height="512" fill="url(#bg)"/>
            <image href="jobpilot-icon.svg" x="0" y="0" width="512" height="512"/>
          </svg>
          EOF

          rsvg-convert -w 180 -h 180 icon-wrapper.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 icon-wrapper.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon-wrapper.svg -o icon-512.png

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
          else
            git commit -m "Remove halo from JobPilot Home Screen icons"
            git push
          fi
