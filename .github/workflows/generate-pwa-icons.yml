name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Home Screen icons exactly like the known-good version
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          # This is deliberately the simple method used for the version where
          # the approved J displayed correctly, with the small iOS halo.
          # Do not composite, resize after rendering, or otherwise alter the artwork.
          rsvg-convert -w 180 -h 180 jobpilot-icon.svg -o jobpilot-apple-touch-icon-v3.png
          rsvg-convert -w 192 -h 192 jobpilot-icon.svg -o jobpilot-icon-192-v3.png
          rsvg-convert -w 512 -h 512 jobpilot-icon.svg -o jobpilot-icon-512-v3.png

      - name: Commit the new exact-raster icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobpilot-apple-touch-icon-v3.png jobpilot-icon-192-v3.png jobpilot-icon-512-v3.png
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
          else
            git commit -m "Use known-good JobPilot icon rasterisation"
            git fetch origin main
            git rebase origin/main
            git push
          fi
