name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Home Screen halo without re-rendering the J
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

          # IMPORTANT: use the exact PNG artwork from the version where the J was correct.
          # Do not rasterise jobpilot-icon.svg here. That is what was changing the J.
          git show 553871338d617a1f60b7db14aaa30208d0316f29:apple-touch-icon.png > source-180.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-192.png > source-192.png
          git show 553871338d617a1f60b7db14aaa30208d0316f29:icon-512.png > source-512.png

          # Build only the matching full-bleed gradient underneath the existing PNG.
          cat > icon-background.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#06144f"/>
                <stop offset="0.55" stop-color="#0644d8"/>
                <stop offset="1" stop-color="#11c7f2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="url(#bg)"/>
          </svg>
          EOF

          rsvg-convert -w 180 -h 180 icon-background.svg -o bg-180.png
          rsvg-convert -w 192 -h 192 icon-background.svg -o bg-192.png
          rsvg-convert -w 512 -h 512 icon-background.svg -o bg-512.png

          # Composite the EXISTING good PNG over the matching background.
          # The logo/J pixels are not re-rendered or redrawn.
          convert bg-180.png source-180.png -composite apple-touch-icon.png
          convert bg-192.png source-192.png -composite icon-192.png
          convert bg-512.png source-512.png -composite icon-512.png

          rm -f source-180.png source-192.png source-512.png bg-180.png bg-192.png bg-512.png icon-background.svg

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
          else
            git commit -m "Remove icon halo while preserving approved J artwork"
            git fetch origin main
            git rebase origin/main
            git push
          fi
