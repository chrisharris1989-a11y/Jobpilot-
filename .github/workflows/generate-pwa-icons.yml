name: Generate JobPilot PWA Icons

on:
  push:
    branches: [main]
    paths:
      - 'jobpilot-icon.svg'
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate edge-clean PNG icons without altering the logo artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

          # First rasterise the approved SVG exactly as-is. This preserves the J artwork.
          rsvg-convert -w 180 -h 180 jobpilot-icon.svg -o jobpilot-180.png
          rsvg-convert -w 192 -h 192 jobpilot-icon.svg -o jobpilot-192.png
          rsvg-convert -w 512 -h 512 jobpilot-icon.svg -o jobpilot-512.png

          # Create a full-bleed copy of the SVG's own background gradient.
          cat > icon-background.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#06144f"/>
                <stop offset="0.55" stop-color="#0644d8"/>
                <stop offset="1" stop-color="#11c7f2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="url(#bg)"/>
          </svg>
          EOF

          rsvg-convert -w 180 -h 180 icon-background.svg -o bg-180.png
          rsvg-convert -w 192 -h 192 icon-background.svg -o bg-192.png
          rsvg-convert -w 512 -h 512 icon-background.svg -o bg-512.png

          # Composite the exact rasterised logo over the matching gradient.
          # This removes the transparent outer edge/halo without changing the J.
          convert bg-180.png jobpilot-180.png -composite apple-touch-icon.png
          convert bg-192.png jobpilot-192.png -composite icon-192.png
          convert bg-512.png jobpilot-512.png -composite icon-512.png

          rm -f jobpilot-180.png jobpilot-192.png jobpilot-512.png bg-180.png bg-192.png bg-512.png icon-background.svg

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
          else
            git commit -m "Fix Home Screen icon halo while preserving JobPilot logo"
            git fetch origin main
            git rebase origin/main
            git push
          fi
