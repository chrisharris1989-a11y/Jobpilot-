name: Refactor company regional address fields

on:
  push:
    paths:
      - '.github/workflows/refactor-company-addresses.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update company address fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('management-company.js')
          text = p.read_text()
          if 'getJobPilotAddressContext' not in text:
              text = text.replace('import { supabase } from "./supabase.js";\n', 'import { supabase } from "./supabase.js";\nimport { getJobPilotAddressContext, normalizeJobPilotPostalCode } from "./regional-address.js";\n')
          text = text.replace('business_name, contact_name, phone, email, website, address_line1, city, postcode,', 'business_name, contact_name, phone, email, website, address_line1, address_line2, address_region, city, postcode,')
          text = text.replace('address: row.address_line1 ?? local.address ?? "",\n    city:', 'address: row.address_line1 ?? local.address ?? "",\n    address2: row.address_line2 ?? local.address2 ?? "",\n    addressRegion: row.address_region ?? local.addressRegion ?? "",\n    city:')
          old = '<label>Business Address</label><input id="companyAddress" type="text" value="${escapeHtml(settings.address)}">\n          <label>Town / City</label><input id="companyCity" type="text" value="${escapeHtml(settings.city)}">\n          <label>Postcode</label><input id="companyPostcode" type="text" value="${escapeHtml(settings.postcode)}">'
          new = '<label>Business Address</label><input id="companyAddress" autocomplete="address-line1" type="text" value="${escapeHtml(settings.address)}">\n          <label>Address line 2</label><input id="companyAddress2" autocomplete="address-line2" type="text" value="${escapeHtml(settings.address2)}">\n          <label>County</label><input id="companyAddressRegion" autocomplete="address-level1" type="text" value="${escapeHtml(settings.addressRegion)}">\n          <label>Town / City</label><input id="companyCity" autocomplete="address-level2" type="text" value="${escapeHtml(settings.city)}">\n          <label>Postcode</label><input id="companyPostcode" autocomplete="postal-code" type="text" value="${escapeHtml(settings.postcode)}">'
          text = text.replace(old, new)
          text = text.replace('address: document.getElementById("companyAddress")?.value.trim() || "",\n    city:', 'address: document.getElementById("companyAddress")?.value.trim() || "",\n    address2: document.getElementById("companyAddress2")?.value.trim() || "",\n    addressRegion: document.getElementById("companyAddressRegion")?.value.trim() || "",\n    city:')
          text = text.replace('postcode: document.getElementById("companyPostcode")?.value.trim() || "",', 'postcode: normalizeJobPilotPostalCode(document.getElementById("companyPostcode")?.value.trim() || "", getJobPilotAddressContext().countryCode),')
          text = text.replace('email: next.businessEmail, address_line1: next.address, city: next.city, postcode: next.postcode,', 'email: next.businessEmail, address_line1: next.address, address_line2: next.address2, address_region: next.addressRegion, city: next.city, postcode: next.postcode,')
          p.write_text(text)
      - name: Commit company address refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management-company.js
          git commit -m "Enable regional company address fields" || true
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/refactor-company-addresses.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time company address workflow" || true
          git push || true
