name: Remove legacy Settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy Settings from app.js
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          # Remove the Settings navigation button.
          text, count = re.subn(
              r'\n\s*<button class="nav-item" data-page="settings">\n\s*⚙️ Settings\n\s*</button>\n',
              '\n',
              text,
          )
          assert count == 1, f"Expected 1 Settings nav button, found {count}"

          # Remove Settings from the page title map.
          text, count = re.subn(
              r'\n\s*settings: \[\n\s*"Settings",\n\s*"Manage your JobPilot account\."\n\s*\]\n',
              '\n',
              text,
          )
          assert count == 1, f"Expected 1 Settings title entry, found {count}"

          # Remove the Settings page dispatch.
          text, count = re.subn(
              r'\n\s*if \(page === "settings"\) \{\n\s*renderSettings\(content\);\n\s*\}\n',
              '\n',
              text,
          )
          assert count == 1, f"Expected 1 Settings page dispatch, found {count}"

          # Remove the complete legacy renderSettings function.
          text, count = re.subn(
              r'\n// =====================================================\n// SETTINGS\n// =====================================================\n\nfunction renderSettings\(content\) \{.*?\n\}\n\nasync function connectFreeAgent\(\)',
              '\n// =====================================================\n// CONNECTIONS\n// =====================================================\n\nasync function connectFreeAgent()',
              text,
              flags=re.S,
          )
          assert count == 1, f"Expected 1 renderSettings block, found {count}"

          # Remove the complete legacy settings helper/password block.
          text, count = re.subn(
              r'\n// =====================================================\n// SETTINGS HELPERS\n// =====================================================\n.*?\n// =====================================================\n// LOGOUT\n// =====================================================',
              '\n// =====================================================\n// LOGOUT\n// =====================================================',
              text,
              flags=re.S,
          )
          assert count == 1, f"Expected 1 Settings helper block, found {count}"

          path.write_text(text, encoding="utf-8")

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/remove-old-settings.yml

      - name: Commit clean Settings removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/remove-old-settings.yml
          git commit -m "Delete legacy Settings function from app"
          git push