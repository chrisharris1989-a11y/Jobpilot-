<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobPilot Customer Portal</title>
<link rel="stylesheet" href="/customer-portal.css">
<style>
.jp-portal-clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}.jp-portal-clickable:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.jp-portal-detail{max-width:850px;margin:20px auto}.jp-portal-detail h2{margin-bottom:8px}.jp-portal-line{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #e5e7eb}.jp-portal-line:last-child{border-bottom:0}.jp-portal-total{font-size:20px;font-weight:700}.jp-portal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.jp-portal-button.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.jp-portal-back{margin-bottom:14px}.jp-portal-message{padding:12px 14px;border-radius:8px;background:#ecfdf5;color:#166534;margin:12px 0}.jp-portal-muted-box{padding:14px;background:#f8fafc;border-radius:8px;margin-top:18px;white-space:pre-line}
</style>
</head>
<body>
<div class="jp-portal">
<header class="jp-portal-header"><div class="jp-portal-brand">JobPilot</div><button id="portal-signout" class="jp-portal-button secondary" hidden>Sign out</button></header>
<main class="jp-portal-main"><div id="portal-root"></div></main>
</div>
<script type="module">
import { supabase } from './supabase.js';
import { getCustomerPortalSession, getPortalDashboard, updatePortalCustomer, acceptPortalQuote, declinePortalQuote, payPortalQuote } from './customer-portal.js';

const root=document.getElementById('portal-root');
const signout=document.getElementById('portal-signout');
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(v||0));
const today=()=>new Date().toISOString().slice(0,10);
let portalSession=null, dashboard=null;

function login(){root.innerHTML=`<div class="jp-portal-card" style="max-width:460px;margin:60px auto"><h1>Customer Portal</h1><p class="jp-portal-muted">Sign in to view your jobs, quotes and invoices.</p><form id="portal-login"><label>Email<br><input id="portal-email" type="email" required style="width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box"></label><button class="jp-portal-button">Send sign-in link</button></form><p id="portal-msg" class="jp-portal-muted"></p></div>`;document.getElementById('portal-login').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('portal-email').value.trim();const msg=document.getElementById('portal-msg');const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:`${location.origin}/portal/`}});msg.textContent=error?error.message:'Check your email for your secure JobPilot sign-in link.';};}
function list(items,empty,render){return items.length?`<div class="jp-portal-list">${items.map(render).join('')}</div>`:`<p class="jp-portal-muted">${empty}</p>`;}
function quoteDetails(q){
  const d=q.details||{}, items=Array.isArray(d.lineItems)?d.lineItems:[], subtotal=Number(q.subtotal||0), discount=Number(d.discount||0), vat=Number(q.vat||0), total=Number(q.total||Math.max(0,subtotal-discount)+vat);
  const status=String(q.status||'draft').toLowerCase();
  root.innerHTML=`<div class="jp-portal-detail"><button id="back-dashboard" class="jp-portal-button secondary jp-portal-back">← Back to portal</button><section class="jp-portal-card"><h2>${esc(q.title||q.quote_number||'Quote')}</h2><p class="jp-portal-muted">${esc(q.quote_number||'')} ${q.valid_until?'· Valid until '+esc(q.valid_until):''}</p>${status==='accepted'?'<div class="jp-portal-message">✓ You have accepted this quote.</div>':''}${status==='declined'?'<div class="jp-portal-muted-box">This quote has been declined.</div>':''}<h3>Quote details</h3>${q.description?`<p>${esc(q.description)}</p>`:''}${d.jobAddress?`<p><strong>Job address</strong><br>${esc(d.jobAddress)}</p>`:''}${items.length?`<h3>Items</h3>${items.map(i=>`<div class="jp-portal-line"><span>${esc(i.description||'Item')}<br><small class="jp-portal-muted">${esc(i.quantity||1)} × ${money(i.unit_price||0)}</small></span><strong>${money(Number(i.quantity||1)*Number(i.unit_price||0))}</strong></div>`).join('')}`:''}<div class="jp-portal-line"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>${discount?`<div class="jp-portal-line"><span>Discount</span><strong>-${money(discount)}</strong></div>`:''}${vat?`<div class="jp-portal-line"><span>VAT${q.vat_percent?' ('+esc(q.vat_percent)+'%)':''}</span><strong>${money(vat)}</strong></div>`:''}<div class="jp-portal-line"><span class="jp-portal-total">Total</span><strong class="jp-portal-total">${money(total)}</strong></div>${q.notes?`<div class="jp-portal-muted-box"><strong>Notes</strong><br>${esc(q.notes)}</div>`:''}${d.paymentTerms?`<div class="jp-portal-muted-box"><strong>Payment terms</strong><br>${esc(d.paymentTerms)}</div>`:''}${d.acceptance?`<div class="jp-portal-muted-box"><strong>Acceptance</strong><br>${esc(d.acceptance)}</div>`:''}<div class="jp-portal-actions">${status!=='accepted'&&status!=='declined'&&status!=='converted'?'<button id="accept-quote" class="jp-portal-button">Accept quote</button><button id="decline-quote" class="jp-portal-button danger">Decline quote</button>':''}${status==='accepted'?'<button id="pay-quote" class="jp-portal-button">💳 Pay this quote</button>':''}</div></section></div>`;
  document.getElementById('back-dashboard').onclick=render;
  document.getElementById('accept-quote')?.addEventListener('click',async()=>{if(!confirm('Accept this quote?'))return;await quoteActionAndRefresh(()=>acceptPortalQuote(q.id),'Quote accepted.');});
  document.getElementById('decline-quote')?.addEventListener('click',async()=>{if(!confirm('Decline this quote?'))return;await quoteActionAndRefresh(()=>declinePortalQuote(q.id),'Quote declined.');});
  document.getElementById('pay-quote')?.addEventListener('click',async()=>{const b=document.getElementById('pay-quote');b.disabled=true;b.textContent='Creating secure payment...';try{const r=await payPortalQuote(q.id);if(!r.url)throw new Error('Stripe did not return a payment URL.');location.href=r.url;}catch(e){alert(e.message||'Could not create payment.');b.disabled=false;b.textContent='💳 Pay this quote';}});
}
async function quoteActionAndRefresh(action,success){try{await action();alert(success);await load();const q=dashboard.quotes.find(x=>x.id===new URLSearchParams(location.search).get('quote'));if(q)quoteDetails(q);else render();}catch(e){alert(e.message||'Could not update quote.');}}
function invoiceDetails(i){const token=i.public_token;root.innerHTML=`<div class="jp-portal-detail"><button id="back-dashboard" class="jp-portal-button secondary jp-portal-back">← Back to portal</button><section class="jp-portal-card"><h2>Invoice ${esc(i.invoice_number||'')}</h2><p class="jp-portal-muted">${i.issue_date?'Issued '+esc(i.issue_date):''}${i.due_date?' · Due '+esc(i.due_date):''}</p><div class="jp-portal-line"><span>Description</span><span>${esc(i.description||'Invoice')}</span></div><div class="jp-portal-line"><span>Subtotal</span><strong>${money(i.subtotal)}</strong></div>${Number(i.vat||0)>0?`<div class="jp-portal-line"><span>VAT</span><strong>${money(i.vat)}</strong></div>`:''}<div class="jp-portal-line"><span class="jp-portal-total">Total</span><strong class="jp-portal-total">${money(i.total)}</strong></div><div class="jp-portal-actions">${token?`<a class="jp-portal-button" href="/public-invoice.html?token=${encodeURIComponent(token)}">View invoice & pay online</a>`:'<span class="jp-portal-muted">Online payment link is not available for this invoice.</span>'}</div>${i.notes?`<div class="jp-portal-muted-box"><strong>Notes</strong><br>${esc(i.notes)}</div>`:''}</section></div>`;document.getElementById('back-dashboard').onclick=render;}
async function load(){portalSession=await getCustomerPortalSession();if(!portalSession)return null;dashboard=await getPortalDashboard(portalSession.customer_id);return dashboard;}
async function render(){try{const session=await load();if(!session){signout.hidden=true;login();return;}signout.hidden=false;const c=portalSession.customers||{};const upcoming=dashboard.jobs.filter(j=>j.scheduled_date&&j.scheduled_date>=today());root.innerHTML=`<h1>Welcome, ${esc(c.name||'Customer')}</h1><p class="jp-portal-muted">Your JobPilot customer portal</p><div class="jp-portal-grid"><section class="jp-portal-card"><h2>Upcoming jobs</h2><div class="jp-portal-stat">${upcoming.length}</div>${list(upcoming.slice(0,5),'No upcoming jobs.',j=>`<div class="jp-portal-row"><strong>${esc(j.title||'Job')}</strong><br><span class="jp-portal-muted">${esc(j.scheduled_date||'')}${j.scheduled_time?' · '+esc(j.scheduled_time):''}</span><br>${esc(j.status||'')}</div>`)}</section><section class="jp-portal-card"><h2>Quotes</h2><div class="jp-portal-stat">${dashboard.quotes.length}</div>${list(dashboard.quotes.slice(0,5),'No quotes yet.',q=>`<button class="jp-portal-row jp-portal-clickable" data-quote="${esc(q.id)}" style="display:block;width:100%;text-align:left;border:0;background:transparent"><strong>${esc(q.title||q.quote_number||'Quote')}</strong><br><span class="jp-portal-muted">${esc(q.quote_number||'')} · ${money(q.total)}</span><br>${esc(q.status||'')}<br><small>View quote →</small></button>`)}</section><section class="jp-portal-card"><h2>Invoices</h2><div class="jp-portal-stat">${dashboard.invoices.length}</div>${list(dashboard.invoices.slice(0,5),'No invoices yet.',i=>`<button class="jp-portal-row jp-portal-clickable" data-invoice="${esc(i.id)}" style="display:block;width:100%;text-align:left;border:0;background:transparent"><strong>${esc(i.invoice_number||'Invoice')}</strong><br><span class="jp-portal-muted">${money(i.total)} · ${esc(i.status||'')}</span><br>${i.due_date?'Due '+esc(i.due_date):''}<br><small>View invoice →</small></button>`)}</section></div><section class="jp-portal-card" style="margin-top:16px"><h2>Your details</h2><p>${esc(c.email||'')}<br>${esc(c.phone||'')}<br>${esc(c.address_line1||'')}${c.city?', '+esc(c.city):''}${c.postcode?' '+esc(c.postcode):''}</p><button id="edit-details" class="jp-portal-button secondary">Update details</button><div id="details-form"></div></section>`;
document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>{const q=dashboard.quotes.find(x=>x.id===b.dataset.quote);if(q)quoteDetails(q);});document.querySelectorAll('[data-invoice]').forEach(b=>b.onclick=()=>{const i=dashboard.invoices.find(x=>x.id===b.dataset.invoice);if(i)invoiceDetails(i);});
document.getElementById('edit-details').onclick=()=>{document.getElementById('details-form').innerHTML=`<form id="save-details"><input id="p-name" value="${esc(c.name)}" placeholder="Name" style="padding:10px;margin:6px;width:90%"><input id="p-email" type="email" value="${esc(c.email)}" placeholder="Email" style="padding:10px;margin:6px;width:90%"><input id="p-phone" value="${esc(c.phone)}" placeholder="Phone" style="padding:10px;margin:6px;width:90%"><input id="p-address" value="${esc(c.address_line1)}" placeholder="Address" style="padding:10px;margin:6px;width:90%"><input id="p-city" value="${esc(c.city)}" placeholder="City" style="padding:10px;margin:6px;width:90%"><input id="p-postcode" value="${esc(c.postcode)}" placeholder="Postcode" style="padding:10px;margin:6px;width:90%"><button class="jp-portal-button">Save</button></form>`;document.getElementById('save-details').onsubmit=async e=>{e.preventDefault();try{await updatePortalCustomer(c.id,{name:document.getElementById('p-name').value,email:document.getElementById('p-email').value,phone:document.getElementById('p-phone').value,address_line1:document.getElementById('p-address').value,city:document.getElementById('p-city').value,postcode:document.getElementById('p-postcode').value});await render();}catch(err){alert(err.message||'Could not update details.');}};};
const params=new URLSearchParams(location.search);if(params.get('quote')){const q=dashboard.quotes.find(x=>x.id===params.get('quote'));if(q)quoteDetails(q);}else if(params.get('invoice')){const i=dashboard.invoices.find(x=>x.id===params.get('invoice'));if(i)invoiceDetails(i);}
}catch(e){root.innerHTML=`<div class="jp-portal-card"><h2>Portal unavailable</h2><p>${esc(e.message||'Please try again.')}</p></div>`;}}
signout.onclick=async()=>{await supabase.auth.signOut();render();};render();
</script>
</body>
</html>
