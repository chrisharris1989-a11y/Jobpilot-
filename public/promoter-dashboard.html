<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPilot Promoter Dashboard</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;margin:0;color:#101828}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.hero{background:#111827;color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 8px}.linkbox{display:flex;gap:8px;margin-top:18px}.linkbox input{flex:1;padding:12px;border-radius:9px;border:0;min-width:0}.copy{background:#fff;color:#111827;border:0;border-radius:9px;padding:0 15px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #eaecf0;border-radius:14px;padding:18px}.label{color:#667085;font-size:13px}.value{font-size:26px;font-weight:800;margin-top:6px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #eaecf0;font-size:14px}th{color:#667085;background:#f9fafb}.empty{text-align:center;padding:30px;color:#667085}.error{background:#fef3f2;color:#b42318;padding:14px;border-radius:10px;display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.linkbox{flex-direction:column}.copy{padding:12px}.top{align-items:flex-start}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">JobPilot Promoter</div><button id="logout" class="btn">Sign out</button></div><div id="error" class="error"></div><section class="hero"><h1 id="welcome">Your referral dashboard</h1><div>Share your unique link and earn 30% commission on qualifying subscriptions.</div><div class="linkbox"><input id="refLink" readonly><button class="copy" id="copy">Copy link</button></div></section><div class="grid"><div class="card"><div class="label">Referrals</div><div class="value" id="referrals">0</div></div><div class="card"><div class="label">Converted</div><div class="value" id="converted">0</div></div><div class="card"><div class="label">Monthly referred value</div><div class="value" id="value">£0</div></div><div class="card"><div class="label">Monthly commission</div><div class="value" id="commission">£0</div></div></div><section class="card"><h2>Referrals</h2><table><thead><tr><th>Business</th><th>Plan</th><th>Status</th><th>Monthly value</th><th>Commission</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></section></div><script type="module">
import {supabase} from './supabase.js';
const $=id=>document.getElementById(id),errBox=$('error');
function fail(e){errBox.textContent=e?.message||String(e);errBox.style.display='block';}
async function load(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){location.href='/promoter-signup.html';return;}
 const {data:p,error:pe}=await supabase.rpc('get_my_promoter_dashboard'); if(pe) throw pe;
 if(!p?.length){fail(new Error('This account is not registered as a JobPilot promoter yet.'));return;}
 const x=p[0];$('welcome').textContent=`Welcome, ${x.promoter_name}`;$('referrals').textContent=x.referral_count||0;$('converted').textContent=x.converted_count||0;$('value').textContent=`£${Number(x.monthly_value||0).toFixed(2)}`;$('commission').textContent=`£${Number(x.monthly_commission||0).toFixed(2)}`;$('refLink').value=`https://app.jobpilotcrm.com/?ref=${encodeURIComponent(x.code)}`;
 const {data:r,error:re}=await supabase.rpc('get_my_promoter_referrals');if(re) throw re;const rows=$('rows');rows.innerHTML='';
 if(!r?.length){rows.innerHTML='<tr><td colspan="5" class="empty">No referrals yet.</td></tr>';return;}
 for(const v of r){const tr=document.createElement('tr');tr.innerHTML=`<td>${v.company_name||'—'}</td><td>${v.plan||'—'}</td><td>${v.subscription_status||v.last_status||'—'}</td><td>£${Number(v.monthly_value||0).toFixed(2)}</td><td>£${Number(v.monthly_commission||0).toFixed(2)}</td>`;rows.appendChild(tr);}
}
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('refLink').value);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy link',1500)};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='/promoter-signup.html'};
load().catch(fail);
</script></body></html>
