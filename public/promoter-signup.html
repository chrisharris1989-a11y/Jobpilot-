<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPilot Promoter Signup</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;width:min(440px,calc(100% - 32px));padding:32px;border-radius:18px;box-shadow:0 10px 35px #0001}h1{margin:0 0 8px}.muted{color:#667085;margin-bottom:24px}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.msg{margin-top:16px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#ecfdf3;color:#027a48}.err{display:block;background:#fef3f2;color:#b42318}.logo{font-weight:800;font-size:24px;margin-bottom:20px}</style>
</head><body><main class="card"><div class="logo">JobPilot</div><h1>Become a JobPilot Promoter</h1><p class="muted">Create your free promoter account and get your unique referral link. You’ll receive a free Business account and earn 30% commission on qualifying referred subscriptions.</p><form id="form"><label>Your name</label><input id="name" required autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label>Business / profile name</label><input id="business" placeholder="Your name or brand" required><button>Create promoter account</button></form><div id="msg" class="msg"></div></main>
<script type="module">
import { supabase } from './supabase.js';
const form=document.getElementById('form'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='Creating your account…';msg.style.display='block';
 const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,business=document.getElementById('business').value.trim();
 const {data,error}=await supabase.auth.signUp({email,password,options:{data:{jobpilot_promoter_signup:true,jobpilot_promoter_name:name,jobpilot_business_name:business}}});
 if(error){msg.className='msg err';msg.textContent=error.message;return;}
 if(data.session){msg.className='msg ok';msg.textContent='Account created. Opening your promoter dashboard…';setTimeout(()=>location.href='/promoter-dashboard.html',500);}
 else {msg.className='msg ok';msg.textContent='Account created. Check your email to confirm your account, then sign in from the promoter dashboard.';setTimeout(()=>location.href='/promoter-dashboard.html',1200);}
});
</script></body></html>
