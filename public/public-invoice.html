<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invoice — JobPilot</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .public-invoice {
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }

    .invoice-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15,23,42,.08);
    }

    .invoice-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .invoice-total {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0;
    }

    .invoice-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .pay-button {
      width: 100%;
      margin-top: 25px;
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .pay-button:disabled {
      opacity: .6;
    }

    .invoice-message {
      margin-top: 18px;
      text-align: center;
      color: #697386;
    }
  </style>
</head>

<body>

  <main class="public-invoice">

    <div id="invoiceContainer">

      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading invoice...</p>
      </div>

    </div>

  </main>

  <script type="module" src="/public-invoice.js"></script>

</body>
</html>
