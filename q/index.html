<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot</title>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <p>Opening your JobPilot link…</p>
  <script>
    (() => {
      const token = new URLSearchParams(window.location.search).get('t') || '';
      if (!/^[A-Za-z0-9]{7}$/.test(token)) {
        document.body.textContent = 'This link is not valid.';
        return;
      }
      window.location.replace(
        `https://qxoynttvipducubmczwl.supabase.co/functions/v1/quote-short-link?t=${encodeURIComponent(token)}`
      );
    })();
  </script>
</body>
</html>
