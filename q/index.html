<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot</title>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <p>Opening your JobPilot customer portal…</p>
  <script>
    const token = new URLSearchParams(window.location.search).get('t');
    if (!token) {
      document.body.innerHTML = '<p>This JobPilot link is invalid.</p>';
    } else {
      window.location.replace('https://qxoynttvipducubmczwl.supabase.co/functions/v1/quote-short-link?t=' + encodeURIComponent(token));
    }
  </script>
</body>
</html>
