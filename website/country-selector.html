<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>JobPilot — Choose your country</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e7ebf0;--blue:#1677e8;--blue-dark:#0e5fbe;--max:720px}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff,#f7f9fc);display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:var(--max);background:#fff;border:1px solid var(--line);border-radius:24px;padding:52px 42px;box-shadow:0 16px 50px rgba(23,32,51,.08);text-align:center}.brand{font-weight:800;font-size:28px;letter-spacing:-.7px;margin-bottom:42px}.brand span{color:var(--blue)}h1{font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-2px;margin:0 0 14px}p{color:var(--muted);font-size:17px;margin:0 auto 34px;max-width:520px}.countries{display:grid;grid-template-columns:1fr 1fr;gap:12px}.country{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:15px 18px;font-size:15px;font-weight:750;cursor:pointer;text-align:left;transition:.15s ease}.country:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,119,232,.1)}.flag{font-size:22px;margin-right:10px;vertical-align:-2px}.change{display:inline-block;margin-top:24px;color:var(--blue);font-size:14px;font-weight:700;text-decoration:none}.change:hover{text-decoration:underline}@media(max-width:560px){.card{padding:38px 22px}.countries{grid-template-columns:1fr}.brand{margin-bottom:32px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Job<span>Pilot</span></div>
  <h1>Welcome to JobPilot</h1>
  <p>Choose your country to see the features and options available in your region.</p>
  <div class="countries">
    <button class="country" data-country="GB"><span class="flag">🇬🇧</span>United Kingdom</button>
    <button class="country" data-country="US"><span class="flag">🇺🇸</span>United States</button>
    <button class="country" data-country="AU"><span class="flag">🇦🇺</span>Australia</button>
    <button class="country" data-country="NZ"><span class="flag">🇳🇿</span>New Zealand</button>
    <button class="country" data-country="IE"><span class="flag">🇮🇪</span>Ireland</button>
    <button class="country" data-country="CA"><span class="flag">🇨🇦</span>Canada</button>
  </div>
  <a class="change" href="change-country.html">Change country</a>
</main>
<script>
const key='jobpilot_country';
const saved=localStorage.getItem(key);
if(saved && !new URLSearchParams(window.location.search).has('change')) window.location.replace('home.html');
document.querySelectorAll('.country').forEach(button=>{
  button.addEventListener('click',()=>{
    localStorage.setItem(key,button.dataset.country);
    window.location.replace('home.html');
  });
});
</script>
</body>
</html>
